[project]
name = "neo4d"
version = "0.1.0"
description = "A self-learning, generalising core on 4D structures: it harvests its own worked examples, routes them through a 4D relabelling space, and decides everything with small integer laws judged by exhaustive enumeration."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "devkancheti4-design" }]
dependencies = ["numpy>=1.26", "fluidfix==0.16.0", "pytest>=8", "pytest-cov>=5", "pytest-timeout>=2"]

[project.scripts]
neo4d = "neo4d.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neo4d*"]

[tool.setuptools.package-data]
neo4d = ["kernels/*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
